<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 작사 · AI 작곡 프롬프트 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0f1024; --bg2:#171936; --card:#1e2145; --card2:#262a56; --line:#33386b;
  --text:#eef0ff; --sub:#a9aed8; --muted:#7c82b5;
  --lyric:#ff8fb1; --lyric2:#ffb38a; --comp:#7cc8ff; --comp2:#9f8cff;
  --ok:#5fe0a8; --warn:#ffd36b;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 10% -10%,#2a1f5a 0%,transparent 60%),
             radial-gradient(1000px 600px at 110% 10%,#123a5a 0%,transparent 55%),var(--bg);
  color:var(--text);font-size:17px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;cursor:pointer}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--lyric),var(--comp2));display:grid;place-items:center;font-size:18px}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;transition:.15s}
.btn:hover{background:var(--card2);transform:translateY(-1px)}
.btn.primary{border:none;background:linear-gradient(135deg,var(--accent,var(--comp)),var(--accent2,var(--comp2)));color:#14152b}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* HOME */
.hero{text-align:center;padding:40px 10px 26px}
.hero .eyebrow{display:inline-block;padding:6px 14px;border-radius:999px;background:#ffffff12;color:var(--sub);font-size:14px;margin-bottom:16px}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.2;font-weight:900;letter-spacing:-1px}
.hero h1 .g1{background:linear-gradient(90deg,var(--lyric),var(--lyric2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .g2{background:linear-gradient(90deg,var(--comp),var(--comp2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--sub);margin-top:14px;font-size:18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}
.choice{position:relative;overflow:hidden;border-radius:26px;padding:34px 30px;border:1px solid var(--line);background:var(--card);text-align:left;color:var(--text);transition:.2s;min-height:300px;display:flex;flex-direction:column}
.choice:hover{transform:translateY(-4px);box-shadow:0 20px 50px #0007}
.choice.l{background:linear-gradient(160deg,#3b1e44 0%,#1e2145 70%)}
.choice.c{background:linear-gradient(160deg,#16365a 0%,#1e2145 70%)}
.choice .ic{font-size:54px;line-height:1}
.choice h2{font-size:34px;margin:16px 0 6px;font-weight:900}
.choice.l h2{color:var(--lyric)} .choice.c h2{color:var(--comp)}
.choice p{color:var(--sub);font-size:16px}
.choice ol{margin-top:16px;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.choice ol li{font-size:13px;padding:4px 10px;border-radius:999px;background:#ffffff12;color:#d9dcff}
.choice .go{margin-top:auto;padding-top:20px;font-weight:800;font-size:17px}
.flow{margin-top:30px;background:#ffffff08;border:1px dashed var(--line);border-radius:var(--radius);padding:20px 24px}
.flow h3{font-size:17px;margin-bottom:10px}
.flow-steps{line-height:2;color:var(--sub);font-size:15px}
.flow-steps b{color:var(--text)}
.flow-steps .arr{color:var(--muted)}

/* STEPPER */
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.stepper::-webkit-scrollbar{height:6px}.stepper::-webkit-scrollbar-track{background:transparent}.stepper::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:6px}
.stp{flex:1 0 auto;min-width:96px;border:none;background:var(--card);color:var(--muted);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;text-align:left;border-bottom:3px solid transparent}
.stp .n{display:block;font-size:12px;opacity:.8}
.stp.done{color:var(--sub);border-bottom-color:var(--accent)}
.stp.on{background:var(--card2);color:var(--text);border-bottom-color:var(--accent2)}

.panel{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:28px}
.panel h2{font-size:28px;font-weight:900;letter-spacing:-.5px}
.panel .desc{color:var(--sub);margin:6px 0 20px}
.tip{background:#ffffff0c;border-left:4px solid var(--accent);padding:12px 16px;border-radius:10px;color:#d6d9ff;font-size:15px;margin:14px 0}
.tip b{color:var(--text)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card-opt{background:var(--card);border:2px solid transparent;border-radius:16px;padding:18px;text-align:left;color:var(--text);transition:.15s}
.card-opt:hover{background:var(--card2)}
.card-opt.sel{border-color:var(--accent);background:linear-gradient(160deg,#ffffff14,var(--card))}
.card-opt .e{font-size:30px}
.card-opt h4{font-size:18px;margin:6px 0 4px}
.card-opt p{font-size:14px;color:var(--sub);line-height:1.5}

.group{margin-top:22px}
.group h3{font-size:16px;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.group h3 .cnt{font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font-size:15px;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-size:12px}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14152b;border-color:transparent;font-weight:700}
.chip.sel small{color:#14152bb0}
.chip.hide{display:none}

.search{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px}
.search:focus,.field:focus{outline:2px solid var(--accent);border-color:transparent}
.catnav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.catnav button{border:none;background:#ffffff10;color:var(--sub);padding:6px 12px;border-radius:999px;font-size:13px}
.catnav button:hover{background:#ffffff22;color:var(--text)}

.field{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);line-height:1.7}
textarea.field{resize:vertical;min-height:110px}
label.lb{display:block;font-weight:700;margin:16px 0 8px}
label.lb small{color:var(--muted);font-weight:500;margin-left:6px}

.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1 1 260px}

.bpm-box{background:var(--card);border-radius:16px;padding:20px}
.bpm-val{font-size:44px;font-weight:900;color:var(--accent)}
.bpm-val small{font-size:16px;color:var(--sub);font-weight:600;margin-left:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.bpm-marks{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* live preview bar */
.live{position:sticky;bottom:12px;margin-top:18px;background:#0b0c1ef2;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;z-index:5}
.live .lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.live .txt{flex:1;font-family:Consolas,"D2Coding",monospace;font-size:13px;color:#cfe7ff;max-height:44px;overflow:auto}

/* output */
.out{background:#0b0c1e;border:1px solid var(--line);border-radius:16px;padding:18px;position:relative}
.out h4{font-size:15px;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.out pre{white-space:pre-wrap;word-break:break-word;font-family:Consolas,"D2Coding",Pretendard,monospace;font-size:15px;line-height:1.7;color:#e7ecff}
.count{font-size:12px;color:var(--muted)}
.count.over{color:var(--warn)}
.ko-explain{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ko-explain span{background:#ffffff0e;border-radius:10px;padding:6px 10px;font-size:13px;color:#d6d9ff}
.ko-explain span b{color:var(--accent);margin-right:4px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.links a{color:var(--text);text-decoration:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{border:none;background:var(--card);color:var(--sub);padding:10px 16px;border-radius:12px;font-weight:700}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14152b}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tagbar button{border:1px dashed var(--line);background:transparent;color:var(--sub);padding:4px 10px;border-radius:8px;font-size:13px}
.tagbar button:hover{color:var(--text);border-color:var(--accent)}
.linecount{background:#0b0c1e;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:420px;overflow:auto;font-size:14px}
.linecount div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid #ffffff08}
.linecount .tg{color:var(--accent);font-weight:700}
.linecount .n{color:var(--muted);font-variant-numeric:tabular-nums}
.linecount .n.long{color:var(--warn)}
.q-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:12px}
.q-card .q{font-weight:700;margin-bottom:8px;display:flex;gap:8px}
.q-card .q .qn{color:var(--accent)}
.q-card textarea{min-height:70px}
.example{font-size:14px;color:var(--sub);background:#ffffff08;border-radius:12px;padding:12px 14px;margin-top:10px;white-space:pre-wrap}
.checklist{list-style:none;display:grid;gap:6px;margin-top:8px}
.checklist li{background:var(--card);padding:10px 14px;border-radius:10px;font-size:15px}
.checklist li::before{content:"✔ ";color:var(--ok)}
.summary-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.summary-tags span{font-size:13px;background:#ffffff10;padding:4px 10px;border-radius:999px;color:#dfe2ff}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);opacity:0;background:#fff;color:#14152b;padding:12px 20px;border-radius:12px;font-weight:700;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer.credit{text-align:center;color:var(--muted);font-size:14px;padding:30px 0 10px;letter-spacing:.3px}
footer.credit b{background:linear-gradient(90deg,var(--lyric),var(--comp));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

body.mode-lyrics{--accent:var(--lyric);--accent2:var(--lyric2)}
body.mode-compose{--accent:var(--comp);--accent2:var(--comp2)}

@media (max-width:780px){
  .choices,.two{grid-template-columns:1fr}
  .panel{padding:20px}
  .live{flex-direction:column;align-items:stretch}
}
@media print{
  header.top,.stepper,.nav,.live,.links,.btn{display:none!important}
  body{background:#fff;color:#000}
  .panel,.out{background:#fff;border:none}
  .out pre{color:#000}
}
</style>
</head>

function composePrompt(){
  const c=S.compose; const parts=[];
  parts.push(...c.genres);
  parts.push(...c.eras);
  parts.push(...c.moods);
  if(c.useBpm) parts.push(c.bpm+" BPM");
  parts.push(...c.feels);
  if(c.key) parts.push(c.key);
  parts.push(...c.instruments);
  if(c.vocalType.includes("instrumental")) parts.push("instrumental");
  else parts.push(...c.vocalType,...c.vocalTone,...c.vocalStyle,...c.lang);
  parts.push(...c.production,...c.structure);
  if(c.extra.trim()) parts.push(c.extra.trim());
  return [...new Set(parts)].join(", ");
}
function composeExplain(){
  const c=S.compose; const out=[];
  const f=(label,arr)=>{ if(arr.length) out.push([label,arr.map(e=>KO[e]||e).join(" · ")]); };
  f("장르",c.genres); f("시대",c.eras); f("분위기",c.moods);
  if(c.useBpm) out.push(["템포",c.bpm+" BPM ("+bpmName(c.bpm)+")"]);
  f("리듬",c.feels); if(c.key) out.push(["조성",KO[c.key]||c.key]);
  f("악기",c.instruments); if(c.vocalType.includes("instrumental")) f("보컬",["instrumental"]); else { f("보컬",[...c.vocalType,...c.vocalTone,...c.vocalStyle]); f("언어",c.lang); }
  f("사운드",c.production); f("구조",c.structure); if(c.extra.trim()) out.push(["추가",c.extra.trim()]);
  return out;
}
function bpmName(b){ return b<70?"아주 느림":b<90?"느림":b<110?"보통":b<125?"경쾌":b<140?"빠름":"아주 빠름"; }
function composeTagsSkeleton(){
  const c=S.compose; const inst=c.vocalType.includes("instrumental");
  if(inst) return "[Intro]\n[Instrumental]\n[Build]\n[Drop]\n[Instrumental Break]\n[Outro]\n[End]";
  let t=["[Intro]","[Verse 1]","(가사)","[Pre-Chorus]","(가사)","[Chorus]","(가사)","[Verse 2]","(가사)","[Chorus]","(가사)"];
  if(c.structure.includes("guitar solo")) t.push("[Guitar Solo]");
  if(c.structure.includes("dance break")) t.push("[Dance Break]");
  if(c.structure.includes("instrumental break")) t.push("[Instrumental]");
  t.push("[Bridge]","(가사)");
  t.push(c.structure.includes("key change in final chorus")?"[Final Chorus - Key Change]":"[Final Chorus]","(가사)");
  t.push(c.structure.includes("fade out ending")?"[Outro - Fade Out]":"[Outro]","[End]");
  return t.join("\n");
}

function josa(w,a,b){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return a; return (c-0xAC00)%28?a:b; }
function lyricStyle(){ return WRITE_STYLES.find(w=>w.id===S.lyrics.style); }
function rawWriting(){
  const L=S.lyrics, st=lyricStyle(); const lines=[];
  if(st) st.qs.forEach((q,i)=>{ const a=(L.answers[i]||"").trim(); if(a && !L.text.includes(a)) lines.push(`- ${q}\n  → ${a}`); });
  const qa=lines.join("\n");
  return {qa, free:L.text.trim()};
}
function lyricPrompt(){
  const L=S.lyrics, st=lyricStyle(); const {qa,free}=rawWriting();
  const themes=[...L.themes, ...(L.customTheme.trim()?[L.customTheme.trim()]:[])];
  const genre=L.genre.map(g=>KO[g]||g).join(", ")||"자유";
  const tpl=STRUCT_TPL[L.tpl].map(x=>`[${x}]`).join(" → ");
  return `당신은 한국 대중음악 전문 작사가입니다. 아래는 제가 직접 쓴 "${st?st.name:"자유"}" 형식의 글입니다.
이 글에 담긴 저의 실제 경험과 감정을 살려서, 노래로 부를 수 있는 가사로 바꿔 주세요.

■ 내가 쓴 글
${[qa, free?"[자유롭게 쓴 글]\n"+free:""].filter(Boolean).join("\n\n")||"(아직 쓴 글이 없습니다)"}

■ 가사 설정
- 주제: ${themes.join(", ")||"글 내용에 맞게"}
- 담고 싶은 감정: ${L.feelings.join(", ")||"글 내용에 맞게"}

- 말투: ${L.tone}

- 곡 구조: ${tpl}
${L.hook.trim()?`- 후렴(훅)에 꼭 들어갈 핵심 문장: "${L.hook.trim()}"\n`:""}${L.must.trim()?`- 꼭 넣고 싶은 단어·표현: ${L.must.trim()}\n`:""}${L.avoid.trim()?`- 피하고 싶은 표현: ${L.avoid.trim()}\n`:""}
■ 작성 규칙
1. 제 글 속의 구체적인 장면, 사물, 대사, 장소를 최대한 살려 주세요. 뻔하고 추상적인 표현(예: 영원히, 운명, 기적)은 줄여 주세요.
2. 한 줄은 노래로 부르기 좋게 짧게(한국어 기준 대략 8~14자) 써 주세요.
3. 후렴(Chorus)은 기억하기 쉬운 반복 구절로 만들고, 곡 전체의 중심 메시지를 담아 주세요.
4. 각 섹션 앞에 Suno 등 AI 작곡 도구가 인식할 수 있도록 영어 대괄호 태그([Verse 1], [Chorus] 등)를 붙여 주세요.
5. 1절은 상황 소개, 2절은 감정 심화, 브릿지는 전환·깨달음이 드러나도록 구성해 주세요.

■ 출력 형식
1) 노래 제목 후보 3개
2) 완성된 가사 (태그 포함)
3) 어떤 부분을 제 글에서 가져왔는지 짧은 설명 (3줄 이내)`;
}
function autoSkeleton(){
  const L=S.lyrics; const {free}=rawWriting();
  const all=[...Object.values(L.answers).filter(Boolean), free].join("\n");
  let sents=all.split(/\n+|(?<=[.!?。…~])\s*|,\s*/).map(s=>s.trim().replace(/[.。]$/,"")).filter(s=>s.length>1);
  // 긴 문장은 쉼표·조사 기준 반으로
  sents=sents.flatMap(s=>{ if(s.length<=22) return [s]; const mid=s.indexOf(" ",Math.floor(s.length/2)); return mid>0?[s.slice(0,mid),s.slice(mid+1)]:[s]; });
  if(!sents.length) return "(먼저 3단계에서 글을 써 주세요)";
  const hook=L.hook.trim()||(sents.slice().sort((a,b)=>Math.abs(a.length-12)-Math.abs(b.length-12))[0]);
  const n=sents.length; const a=Math.ceil(n/3);
  const v1=sents.slice(0,a), v2=sents.slice(a,a*2), br=sents.slice(a*2);
  const f0=L.feelings[0], t0=L.themes[0]?L.themes[0].split(/[·(]/)[0].trim():"";
  const chorus=[hook, (f0?f0+josa(f0,"이","가")+" 밀려와":"오늘도 나는 노래해"), hook, (t0?t0+", 그 이름을 불러":"이 마음을 불러")];
  const blk=(t,arr)=>`[${t}]\n${(arr.length?arr:["(여기에 장면을 더 써 보세요)"]).slice(0,6).join("\n")}`;
  return [blk("Verse 1",v1),blk("Chorus",chorus),blk("Verse 2",v2),blk("Chorus",chorus),blk("Bridge",br),blk("Final Chorus",chorus),"[Outro]\n"+hook].join("\n\n");
}

    <label class="lb">노래 제목</label>
    <input class="field" data-model="lyrics.title" value="${esc(L.title)}" placeholder="예: 밥은 먹었니">
    <div class="summary-tags" style="margin-top:14px">${[lyricStyle()?.name,...L.themes,...L.feelings.slice(0,4),...L.genre.map(g=>KO[g]||g),L.tone].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <div class="out" style="margin-top:16px"><h4>📝 ${esc(L.title||"제목 미정")} <button class="btn sm primary" data-copy="lyricsFinal">📋 가사 복사</button></h4>
      <pre>${has?esc(L.final):"(5단계 편집칸에 가사가 없어요. 이전 단계로 돌아가 가사를 붙여넣어 주세요.)"}</pre></div>
    <div class="links">
      <button class="btn primary" data-act="toCompose">🎹 이 가사로 AI 작곡 하러 가기 →</button>
      <button class="btn" data-act="dlLyrics">💾 텍스트 파일 저장</button>
      <button class="btn" data-act="print">🖨️ 인쇄</button>
      <a class="btn" href="https://suno.com/create" target="_blank" rel="noopener">🎧 Suno 열기</a>
    </div>
    <div class="tip"><b>다음 단계</b> · 'AI 작곡으로 가기'를 누르면 고른 노래 장르가 작곡 장르에 미리 채워지고, 작곡 완성 화면에 이 가사가 함께 나와 Suno에 한 번에 옮길 수 있어요.</div>`; }
  }
}
function writingLen(){ const {qa,free}=rawWriting(); return (qa.replace(/^- .*$/gm,"")+free).replace(/[\s→]/g,"").length; }
function lineCountHTML(t){
  if(!t.trim()) return `<span style="color:var(--muted)">가사를 입력하면 줄마다 글자 수가 보여요</span>`;
  return t.split("\n").map(l=>{
    const s=l.trim(); if(!s) return "";
    if(/^\[.*\]$/.test(s)) return `<div><span class="tg">${esc(s)}</span></div>`;
    const n=s.replace(/\s/g,"").length;
    return `<div><span>${esc(s)}</span><span class="n ${n>14?"long":""}">${n}</span></div>`;
  }).join("");
}

/* =========================================================
   이벤트
   ========================================================= */
function afterRender(keep){
  if(!keep) window.scrollTo({top:0,behavior:"smooth"});
  const gs=$("#gSearch");
  if(gs) gs.addEventListener("input",()=>{
    const q=gs.value.trim().toLowerCase();
    document.querySelectorAll("#gList .group").forEach(g=>{
      let any=false;
      g.querySelectorAll(".chip").forEach(ch=>{ const hit=!q||ch.textContent.toLowerCase().includes(q); ch.classList.toggle("hide",!hit); any=any||hit; });
      g.style.display=any?"":"none";
    });
  });
  const bpm=$("#bpm");
  if(bpm) bpm.addEventListener("input",()=>{ S.compose.bpm=+bpm.value; save(); updBpm(); });
  const ub=$("#useBpm"); if(ub) ub.addEventListener("change",()=>{ S.compose.useBpm=ub.checked; save(); updLive(); });
}
function updBpm(){ const v=$("#bpmVal"); if(v) v.innerHTML=`${S.compose.bpm}<small>BPM · ${bpmName(S.compose.bpm)}</small>`; const r=$("#bpm"); if(r) r.value=S.compose.bpm; updLive(); }
function updLive(){ const l=$("#livePrompt"); if(l) l.textContent=composePrompt()||"선택하면 여기에 프롬프트가 쌓여요"; }

document.addEventListener("click",e=>{
  if(e.target.closest("#homeBtn")){ S.mode=null; save(); render(); return; }
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if(d.mode){ e.preventDefault(); S.mode=d.mode; S.step=0; save(); render(); return; }
  if(d.goto!==undefined){ S.step=+d.goto; save(); render(); return; }
  if(d.jump){ document.getElementById(d.jump).scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(d.style){ S.lyrics.style=d.style; save(); render(true); return; }
  if(d.tab){ S.lyrics.convTab=d.tab; save(); render(true); return; }
  if(d.bpm){ S.compose.bpm=+d.bpm; S.compose.useBpm=true; save(); updBpm(); const ub=$("#useBpm"); if(ub) ub.checked=true; return; }
  if(d.radio){ setPath(d.radio,d.val); const box=t.parentElement; box.querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel",c===t)); if(d.radio==="lyrics.tpl") render(true); updLive(); return; }
  if(d.path){
    const arr=getPath(d.path); const i=arr.indexOf(d.val); const max=+(t.closest(".chips")?.dataset.max||0);
    if(i>=0){ arr.splice(i,1); t.classList.remove("sel"); }
    else{
      if(d.path==="compose.vocalType"&&d.val==="instrumental"){ arr.length=0; t.closest(".chips").querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); }
      else if(d.path==="compose.vocalType"&&arr.includes("instrumental")){ arr.splice(arr.indexOf("instrumental"),1); t.closest(".chips").querySelector('[data-val="instrumental"]')?.classList.remove("sel"); }
      if(max && arr.length>=max){ toast(`최대 ${max}개까지 고를 수 있어요`); return; }
      arr.push(d.val); t.classList.add("sel");
    }
    save(); updLive(); return;
  }
  if(d.tag){ insertAtCursor($("#finalLyrics"), (t.dataset.tag)+"\n"); return; }
  if(d.copy){
    const L=S.lyrics,c=S.compose;
    const map={prompt:composePrompt(),exclude:c.exclude,skeleton:composeTagsSkeleton(),lyricsFinal:L.final,lyricPrompt:lyricPrompt(),
      all:`[제목]\n${c.title||L.title||""}\n\n[Styles]\n${composePrompt()}\n${c.exclude?`\n[Exclude Styles]\n${c.exclude}\n`:""}\n[Lyrics]\n${L.final.trim()||composeTagsSkeleton()}\n\nBy Mindstream LAB Awesome JWY`};
    copy(map[d.copy]||""); return;
  }
  switch(d.act){
    case "home": S.mode=null; save(); render(); break;
    case "prev": if(S.step>0){S.step--; save(); render();} break;
    case "next": S.step++; save(); render(); break;
    case "reset":
      if(confirm(`${S.mode==="compose"?"AI 작곡":"AI 작사"} 과정에서 입력한 내용을 모두 지울까요?`)){ const b=DEFAULT(); S[S.mode]=b[S.mode]; S.step=0; save(); render(); toast("초기화했어요"); }
      break;
    case "randomGenre": {
      const all=Object.values(GENRES).flat(); const pick=()=>all[Math.floor(Math.random()*all.length)][1];
      S.compose.genres=[...new Set([pick(),pick()])]; save(); render(true);
      toast("🎲 "+S.compose.genres.map(g=>KO[g]).join(" + ")); break; }
    case "mergeAns": {
      const st=lyricStyle(); const ans=st.qs.map((q,i)=>(S.lyrics.answers[i]||"").trim()).filter(Boolean).join("\n");
      if(!ans){ toast("먼저 질문에 답해 주세요"); break; }
      S.lyrics.text=(S.lyrics.text.trim()?S.lyrics.text.trim()+"\n\n":"")+ans; save(); render(true); toast("답변을 모아 왔어요. 이어서 다듬어 보세요"); break; }
    case "useSkeleton":
      if(S.lyrics.final.trim() && !confirm("편집칸의 기존 가사를 뼈대로 바꿀까요?")) break;
      S.lyrics.final=autoSkeleton(); save(); render(true); toast("편집칸으로 가져왔어요"); break;
    case "toCompose":
      if(S.lyrics.genre.length && !S.compose.genres.length) S.compose.genres=S.lyrics.genre.slice(0,3);
      if(S.lyrics.title && !S.compose.title) S.compose.title=S.lyrics.title;
      if(!S.compose.lang.length) S.compose.lang=[S.lyrics.eng.startsWith("전체 영어")?"english lyrics":S.lyrics.eng.startsWith("영어 없이")?"korean lyrics":"korean and english lyrics"];
      S.mode="compose"; S.step=0; save(); render(); toast("가사 정보를 가지고 작곡으로 이동했어요"); break;
    case "dlLyrics": download(`${S.lyrics.title||"나의 가사"}.txt`, `${S.lyrics.title||"제목 미정"}\n\n${S.lyrics.final}\n\n---\n[원문]\n${[rawWriting().qa,rawWriting().free].filter(Boolean).join("\n\n")}\n\nBy Mindstream LAB Awesome JWY`); break;
    case "dlCompose": download(`${S.compose.title||S.lyrics.title||"나의 곡"}_프롬프트.txt`, `[제목]\n${S.compose.title||S.lyrics.title||""}\n\n[Styles]\n${composePrompt()}\n\n[한국어 풀이]\n${composeExplain().map(([k,v])=>`${k}: ${v}`).join("\n")}\n\n[Exclude Styles]\n${S.compose.exclude}\n\n[Lyrics]\n${S.lyrics.final.trim()||composeTagsSkeleton()}\n\nBy Mindstream LAB Awesome JWY`); break;
    case "print": window.print(); break;
  }
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.model){ setPath(t.dataset.model,t.value);
    if(t.id==="finalLyrics"){ const lc=$("#lineCount"); if(lc) lc.innerHTML=lineCountHTML(t.value); }
    if(t.dataset.model.startsWith("compose")) updLive();
  }
  if(t.dataset.ans!==undefined){ S.lyrics.answers[t.dataset.ans]=t.value; save(); }
  if(t.dataset.ans!==undefined||t.id==="freeText"){ const w=$("#wcount"); if(w){ const len=writingLen(); w.textContent=`공백 제외 ${len}자 · 300자 이상이면 풍성한 가사가 나와요`; } }
});

function insertAtCursor(ta,text){
  if(!ta) return; const s=ta.selectionStart,en=ta.selectionEnd; const before=ta.value.slice(0,s);
  const pre = before && !before.endsWith("\n") ? "\n\n" : (before.endsWith("\n")&&!before.endsWith("\n\n")&&before?"\n":"");
  ta.value=before+pre+text+ta.value.slice(en); const pos=(before+pre+text).length; ta.focus(); ta.setSelectionRange(pos,pos);
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

render();
</script>
